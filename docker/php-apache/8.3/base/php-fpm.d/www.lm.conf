; This file will be loaded after the default www.conf
; Use it to override the default settings
; @see README.md
;
; Local development target: 1 vCPU / 1GB RAM with low request volume.
; Assumptions:
; - Average worker RSS in dev: ~70MB
; - Reserve memory for OS, php-fpm master process and buffers
; - Keep headroom to avoid OOM while still handling browser burst traffic
;
; Throughput estimate for manual testing:
; - ~2-3 req/s per worker for typical local endpoints
; - 4 workers => ~8-12 req/s burst capacity

[global]
process_control_timeout = 5s
; Redirects error logs to stderr (/proc/self/fd/2)
error_log = /proc/self/fd/2

[www]
; Redirects access logs to stdout (/proc/self/fd/2)
access.log = /proc/self/fd/2
; Ensures worker output is also sent to stdout and stderr.
catch_workers_output = 1

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 15s
pm.max_requests = 300
request_terminate_timeout = 60s
