# For local tests
services:
  backend:
    build: ./php-apache
    working_dir: /var/www/html
    ports:
      - ${BACKEND_PORT:-80}:80
    networks:
      - leasingmarkt
    volumes:
      - ../be:/var/www/html
    environment:
      SERVER_NAME: localhost

  cli:
    build: ./php-apache
    restart: "no"
    working_dir: /var/www/html
    entrypoint: "/bin/sh"
    networks:
      - leasingmarkt
    profiles: [cli]
    volumes:
      - ../be:/var/www/html
    environment:
      HOST_UID: 1000
      HOST_GID: 1000
    user: www-data

  frontend:
    build:
      context: ../fe
      dockerfile: ../docker/fe/Dockerfile
    ports:
      - ${FE_PORT:-3000}:3000
    networks:
      - leasingmarkt
    depends_on:
      - backend
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - ../fe:/app
      - /app/node_modules

  db:
    image: mariadb:10
    restart: always
    ports:
      - ${DB_PORT:-3306}:3306
    networks:
      - leasingmarkt
    volumes:
      - db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: leasingmarkt
      MYSQL_USER: leasingmarkt
      MYSQL_PASSWORD: password
    command: [
      "mysqld",
      "--max_allowed_packet=64M",
      "--innodb-log-file-size=1G",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--default-authentication-plugin=mysql_native_password"
    ]

volumes:
  db-data:

networks:
  leasingmarkt:
    external: true
